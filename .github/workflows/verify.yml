name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 目录结构校验
        run: bash scripts/verify.sh "$PWD"

      - name: 校验 VERSION 与 SKILL.md 版本一致
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          fm=$(awk '/^---$/{n++; next} n==1 && /^version:/{gsub(/^version:[ ]*/,""); gsub(/"/,""); print; exit}' SKILL.md)
          echo "VERSION=$v  frontmatter=$fm"
          [ "$v" = "$fm" ] || { echo "::error::VERSION 与 SKILL.md version 不一致"; exit 1; }

      - name: 校验脚本语法
        run: for f in scripts/*.sh; do bash -n "$f" && echo "ok $f"; done

      - name: 校验引用的文件都存在
        run: |
          fail=0
          for ref in $(grep -ohE '(references|commands|assets/templates|scripts)/[A-Za-z0-9._-]+' SKILL.md README.md | sort -u); do
            [ -e "$ref" ] || { echo "::error::缺失文件 $ref"; fail=1; }
          done
          exit $fail
